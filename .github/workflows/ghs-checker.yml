name: GHS checker

on:
  push:
    paths:
      - 'checker/**'
      - '.github/workflows/ghs-checker.yml'
  pull_request:
    paths:
      - 'checker/**'
      - '.github/workflows/ghs-checker.yml'

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checker and available research tests
        working-directory: checker
        run: python -m unittest discover -v
